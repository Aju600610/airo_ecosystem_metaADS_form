<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Silicon Corridor Initiative | Executive Evaluation Portal</title>
    <style>
        :root {
            --primary-glow: rgba(30, 58, 138, 0.4);
            --secondary-glow: rgba(59, 130, 246, 0.2);
            --bg-gradient: linear-gradient(135deg, #090d1a 0%, #05070f 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-accent: #3b82f6;
            --neon-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow elements for premium 2027 UI aesthetic */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            top: -10%;
            left: -10%;
            background: var(--primary-glow);
        }
        body::after {
            bottom: -10%;
            right: -10%;
            background: var(--secondary-glow);
        }

        .glass-container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .glass-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(30, 58, 138, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .branding-title {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .branding-subtitle {
            color: var(--neon-accent);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 40px 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 9px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input::placeholder {
            color: #475569;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        select option {
            background: #0f172a;
            color: var(--text-main);
        }

        /* 📋 Premium Checkbox Styling for Form Acknowledgement */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 28px 0 20px 0;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-top: 2px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--neon-accent);
        }
        
        .checkbox-label {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.5;
            cursor: pointer;
            user-select: none;
        }
        
        .checkbox-label span {
            color: var(--text-main);
            font-weight: 600;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 15px;
        }

        button:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #60a5fa 100%);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.5), 
                        0 0 15px var(--neon-glow);
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>

    </form>
</div>
